version: '3.9'
services:
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    ports:
      - '8081:8081'
    environment:
      - SPRING_PROFILES_ACTIVE=default

  event-gateway:
    build:
      context: ./event-gateway
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - ACCOUNT_SERVICE_URL=http://account-service:8081
    depends_on:
      - account-service
